<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Games by Year</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8; --panel: #ffffff; --text: #1a1a1a; --muted: #666666;
    --border: #e2e2e5; --accent: #3b5bfd; --tag-bg: #eef0ff; --tag-text: #33409e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15161a; --panel: #1e2025; --text: #e9e9ec; --muted: #9a9aa2;
      --border: #303239; --accent: #7d93ff; --tag-bg: #262a44; --tag-text: #b7c0ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 32px 24px 16px; max-width: 1000px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .sub { color: var(--muted); font-size: 0.9rem; }
  .controls {
    max-width: 1000px; margin: 0 auto; padding: 0 24px 16px;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
  }
  select {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 0.95rem; min-width: 180px;
  }
  .count { color: var(--muted); font-size: 0.9rem; margin-left: auto; }
  main { max-width: 1000px; margin: 0 auto; padding: 0 24px 48px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; display: flex; gap: 12px;
  }
  .cover {
    width: 64px; height: 64px; object-fit: cover; border-radius: 6px; flex-shrink: 0;
  }
  .card-body { min-width: 0; }
  .card h3 { margin: 0 0 6px; font-size: 1rem; }
  .card h3 a { color: var(--text); text-decoration: none; }
  .card h3 a:hover { color: var(--accent); text-decoration: underline; }
  .meta { color: var(--muted); font-size: 0.82rem; margin-bottom: 8px; }
  .desc {
    color: var(--muted); font-size: 0.8rem; margin: 6px 0; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    background: var(--tag-bg); color: var(--tag-text); border-radius: 999px;
    padding: 2px 9px; font-size: 0.75rem;
  }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; grid-column: 1 / -1; }
  .more { text-align: center; padding: 20px 0 0; }
  .more button {
    padding: 9px 18px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 0.95rem; cursor: pointer;
  }
  .more button:hover { border-color: var(--accent); color: var(--accent); }
  .foot { max-width: 1000px; margin: 0 auto; padding: 0 24px 32px; color: var(--muted); font-size: 0.8rem; }
  .foot a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Video Games by Year</h1>
  <div class="sub">@@TOTAL@@ titles, @@SOURCES@@. Filter by year and platform.</div>
</header>
<div class="controls">
  <select id="year" aria-label="Year"></select>
  <select id="platform" aria-label="Platform"></select>
  <span class="count" id="count"></span>
</div>
<main><div class="grid" id="grid"></div><div class="more" id="more"></div></main>
@@FOOTER@@
<script>
// One entry per year: y = year, n = titles, p = {platform: titles}. The titles
// themselves live in data/web/<year>.js and are fetched when a year is needed.
const YEARS = @@YEARS_JSON@@;

const yearSel = document.getElementById('year');
const platSel = document.getElementById('platform');
const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const moreEl = document.getElementById('more');

const CHUNK = 200;
const GAMES = window.GAMES = window.GAMES || {};
const loading = {};
let current = [];
let shown = 0;
let ticket = 0;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
  });
}

// A <script> tag rather than fetch(), so the page also works opened straight from disk.
function loadYear(y) {
  if (GAMES[y]) return Promise.resolve();
  if (!loading[y]) {
    loading[y] = new Promise(function (resolve, reject) {
      const s = document.createElement('script');
      s.src = 'data/web/' + y + '.js';
      s.onload = resolve;
      s.onerror = function () {
        delete loading[y];
        reject(new Error('Could not load data/web/' + y + '.js'));
      };
      document.head.appendChild(s);
    });
  }
  return loading[y];
}

function setOptions(sel, items, wanted) {
  sel.innerHTML = items.map(function (it) {
    return '<option value="' + escapeHtml(it.value) + '">' + escapeHtml(it.label) + '</option>';
  }).join('');
  sel.value = wanted;
  if (sel.value !== wanted) sel.value = '';
}

// Each dropdown shows how many titles it would give with the other one's
// current choice, and leaves out choices that would give none.
function refreshOptions() {
  const y = yearSel.value;
  const p = platSel.value;
  const yearItems = [{value: '', label: 'All years'}];
  const totals = {};
  YEARS.forEach(function (e) {
    const n = p ? (e.p[p] || 0) : e.n;
    if (n) yearItems.push({value: String(e.y), label: e.y + ' (' + n + ')'});
    if (!y || String(e.y) === y) {
      Object.keys(e.p).forEach(function (name) { totals[name] = (totals[name] || 0) + e.p[name]; });
    }
  });
  const byName = function (a, b) { return a.localeCompare(b, undefined, {sensitivity: 'base'}); };
  const platItems = [{value: '', label: 'All platforms'}].concat(Object.keys(totals).sort(byName).map(function (name) {
    return {value: name, label: name + ' (' + totals[name] + ')'};
  }));
  setOptions(yearSel, yearItems, y);
  setOptions(platSel, platItems, p);
}

async function render() {
  const mine = ++ticket;
  const y = yearSel.value;
  const p = platSel.value;
  const years = YEARS.filter(function (e) {
    return (!y || String(e.y) === y) && (!p || e.p[p]);
  }).map(function (e) { return e.y; });
  const missing = years.filter(function (yr) { return !GAMES[yr]; });
  if (missing.length) {
    grid.innerHTML = '';
    moreEl.innerHTML = '';
    countEl.textContent = 'Loading ' + missing.length + ' year' + (missing.length === 1 ? '' : 's') + '…';
    try {
      await Promise.all(missing.map(loadYear));
    } catch (err) {
      if (mine !== ticket) return;
      countEl.textContent = '';
      grid.innerHTML = '<div class="empty">' + escapeHtml(err.message) +
        '. Open this page from the repository (or GitHub Pages) so the data/web folder sits next to it.</div>';
      return;
    }
  }
  if (mine !== ticket) return;  // a newer choice took over while this one was loading
  current = [];
  years.forEach(function (yr) {
    GAMES[yr].forEach(function (g) {
      if (!p || g.p.indexOf(p) !== -1) current.push([yr, g]);
    });
  });
  countEl.textContent = current.length + ' title' + (current.length === 1 ? '' : 's');
  moreEl.innerHTML = '';
  shown = 0;
  if (!current.length) {
    grid.innerHTML = '<div class="empty">No titles match that combination.</div>';
    return;
  }
  grid.innerHTML = '';
  showMore();
}

function showMore() {
  const next = Math.min(current.length, shown + CHUNK);
  grid.insertAdjacentHTML('beforeend', current.slice(shown, next).map(cardHtml).join(''));
  shown = next;
  const remaining = current.length - shown;
  moreEl.innerHTML = remaining > 0
    ? '<button type="button" id="more-btn">Show ' + Math.min(CHUNK, remaining) + ' more (' + remaining + ' not shown yet)</button>'
    : '';
}

function cardHtml(item) {
  const year = item[0];
  const g = item[1];
  const titleHtml = g.l
    ? '<a href="' + escapeHtml(g.l) + '" target="_blank" rel="noopener">' + escapeHtml(g.t) + '</a>'
    : escapeHtml(g.t);
  const metaBits = [escapeHtml(g.r || year)];
  if (g.d) metaBits.push(escapeHtml(g.d));
  if (g.g) metaBits.push(escapeHtml(g.g));
  const tags = g.p.map(function (pl) {
    return '<span class="tag">' + escapeHtml(pl) + '</span>';
  }).join('');
  const cover = g.i
    ? '<img class="cover" src="' + escapeHtml(g.i) + '" alt="" loading="lazy" onerror="this.remove()">'
    : '';
  const desc = g.s ? '<div class="desc">' + escapeHtml(g.s) + '</div>' : '';
  return '<div class="card">' + cover +
    '<div class="card-body"><h3>' + titleHtml + '</h3>' +
    '<div class="meta">' + metaBits.join(' &middot; ') + '</div>' +
    desc +
    '<div class="tags">' + tags + '</div></div></div>';
}

moreEl.addEventListener('click', function (ev) {
  if (ev.target && ev.target.id === 'more-btn') showMore();
});
function onChange() {
  refreshOptions();
  render();
}
yearSel.addEventListener('change', onChange);
platSel.addEventListener('change', onChange);

// Start on the latest year that has a decent number of titles, rather than
// loading every year just to show the first screenful.
const thisYear = new Date().getFullYear();
const startYear = YEARS.filter(function (e) { return e.y <= thisYear && e.n >= 100; }).pop();
refreshOptions();
if (startYear) {
  yearSel.value = String(startYear.y);
  refreshOptions();
}
render();
</script>
</body>
</html>
